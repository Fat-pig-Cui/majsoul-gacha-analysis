# 下半部分（进阶篇）旁白稿。字段含义同 part1.yaml：
# sub 字幕；say TTS 读法；quiz 思考题（句后 5 秒倒计时）。
# 字母和下标的读法：S<sub>0</sub> 念“S零”，q<sub>k</sub> 念“q k”，r<sub>01</sub> 念“r零一”，ΔE 念“德尔塔E”。

S2_0_Recap:
  - sub: 上个视频，我们推出了单目标的信仰变动期望公式。
  - sub: 它的思路，是把每次十连之后的情况分成两支：抽到，或者没抽到。
  - sub: 没抽到的话，下一次十连又分出两支，这样一直延伸，像一棵越来越大的树。
  - sub: 但仔细看，所有“没抽到”的节点，其实是同一个状态：还没拿到目标。
  - sub: 所有“抽到”的节点，也是同一个状态：目标到手。
  - sub: 把相同的状态合并，这棵树就收拢成了两个圆圈和几条箭头。
  - sub: 这就是马尔科夫过程：下一步去哪里，只取决于现在在哪里，跟之前怎么走过来的无关。
  - sub: 箭头上是一次十连的转移概率，记作 r<sub>ij</sub>，表示从状态 i 走到状态 j。
    say: 箭头上是一次十连的转移概率，记作r i j，表示从状态i走到状态j。
  - sub: 单目标时，r<sub>01</sub> 是一次十连抽到的概率，r<sub>00</sub> 是没抽到的概率，两者加起来等于 1。
    say: 单目标时，r零一是一次十连抽到的概率，r零零是没抽到的概率，两者加起来等于一。
  - sub: 目标一多，就要加更多的状态。我们从最简单的开始：常规双 UP，两个都要。
    say: 目标一多，就要加更多的状态。我们从最简单的开始：常规双UP，两个都要。

S2_1_Model:
  - sub: 常规双 UP，每个角色的概率是 1.475%，信仰价格 150。
    say: 常规双UP，每个角色的概率是百分之一点四七五，信仰价格一百五十。
  - sub: 状态有三个：一个都没有，记作 S<sub>0</sub>；有其中一个，记作 S<sub>1</sub>；两个都有，记作 S<sub>2</sub>。
    say: 状态有三个：一个都没有，记作S零；有其中一个，记作S一；两个都有，记作S二。
  - sub: 已经拿到的角色不会丢，所以箭头只会从左指向右。
  - sub: 为了算出每条箭头的概率，先定义一个量：q<sub>k</sub>。
    say: 为了算出每条箭头的概率，先定义一个量：q k。
  - sub: q<sub>k</sub> 是一次十连里，k 个指定目标一个都没出的概率，也就是 (1 − kp)<sup>9</sup>。
    say: q k是一次十连里，k个指定目标一个都没出的概率，也就是一减k p的九次方。
  - sub: 从 S<sub>0</sub> 出发：两个都没出，就留在原地，概率是 q<sub>2</sub>。
    say: 从S零出发：两个都没出，就留在原地，概率是q二。
  - sub: 只出了 A、没出 B 呢？B 没出的概率是 q<sub>1</sub>，扣掉 A、B 都没出的 q<sub>2</sub>，就是 q<sub>1</sub> − q<sub>2</sub>。
    say: 只出了A、没出B呢？B没出的概率是q一，扣掉A和B都没出的q二，就是q一减q二。
  - sub: 只出 B 也一样，所以 r<sub>01</sub> = 2(q<sub>1</sub> − q<sub>2</sub>)。
    say: 只出B也一样，所以r零一等于二倍的q一减q二。
  - sub: 剩下的就是一次十连两个都出：r<sub>02</sub> = 1 − 2q<sub>1</sub> + q<sub>2</sub>。
    say: 剩下的就是一次十连两个都出：r零二等于一减二q一加q二。
  - sub: 从 S<sub>1</sub> 出发就简单了：只剩一个目标，没出的概率是 q<sub>1</sub>，出了的概率是 1 − q<sub>1</sub>。
    say: 从S一出发就简单了：只剩一个目标，没出的概率是q一，出了的概率是一减q一。
  - sub: S<sub>2</sub> 是终点，进去就不出来了。
    say: S二是终点，进去就不出来了。
  - sub: 把这些关系写成方程组：第 N 次十连后的分布，由第 N − 1 次的分布推出来。
    say: 把这些关系写成方程组：第N次十连后的分布，由第N减一次的分布推出来。
  - sub: 再把系数抽出来，就是马尔科夫链的转移概率矩阵 R。
    say: 再把系数抽出来，就是马尔科夫链的转移概率矩阵R。
  - sub: 每做一次十连，就乘一次 R。N 次十连后的分布，就是 R<sup>N</sup> 乘以初始分布。
    say: 每做一次十连，就乘一次R。N次十连后的分布，就是R的N次方，乘以初始分布。

S2_2_Flow:
  - sub: 光看矩阵有点抽象，我们让概率动起来。
  - sub: 一开始，全部概率都在 S<sub>0</sub>。
    say: 一开始，全部概率都在S零。
  - sub: 第 1 次十连后，大约 76% 留在 S<sub>0</sub>，22% 流到 S<sub>1</sub>，只有 1.4% 直接到了 S<sub>2</sub>。
    say: 第一次十连后，大约百分之七十六留在S零，百分之二十二流到S一，只有百分之一点四直接到了S二。
  - sub: 继续抽下去，S<sub>0</sub> 越来越少，S<sub>2</sub> 越来越多。
    say: 继续抽下去，S零越来越少，S二越来越多。
  - sub: 中间的 S<sub>1</sub> 比较有意思：先涨后跌，第 5 次十连左右最高，大约一半。
    say: 中间的S一比较有意思：先涨后跌，第五次十连左右最高，大约一半。
  - sub: 因为它一边从 S<sub>0</sub> 接收概率，一边往 S<sub>2</sub> 送出概率。
    say: 因为它一边从S零接收概率，一边往S二送出概率。
  - sub: 到第 30 次十连，96% 的情况已经两个都拿到了。
    say: 到第三十次十连，百分之九十六的情况，已经两个都拿到了。
  - sub: 把每个十连数的分布叠起来，就是这张面积图，三种颜色加起来始终是 1。
    say: 把每个十连数的分布叠起来，就是这张面积图，三种颜色加起来始终是一。

S2_3_Expect:
  - sub: 接下来引入信仰。停在不同的状态，最后要花的信仰不一样。
  - sub: 停在 S<sub>0</sub>，两个都要兑换，花 300；停在 S<sub>1</sub>，兑换一个，花 150；到了 S<sub>2</sub>，不用花。
    say: 停在S零，两个都要兑换，花三百；停在S一，兑换一个，花一百五十；到了S二，不用花。
  - sub: 仿照单目标，可以写出期望：第一项是两个都抽到的情况，后两项是要兑换的情况。
  - sub: 但这个公式真的对吗？
  - sub: 还是上个视频那个坑：第一项用的是“N 次以内到达 S<sub>2</sub>”的概率，没考虑抽到就停手。
    say: 还是上个视频那个坑：第一项用的是N次以内到达S二的概率，没考虑抽到就停手。
  - sub: 我们要的是“恰好在第 n 次十连到达 S<sub>2</sub>”的概率，数学上叫首达概率。
    say: 我们要的是恰好在第n次十连到达S二的概率，数学上叫首达概率。
  - sub: S<sub>2</sub> 进去就不出来，叫做吸收态，所以首达概率很好算：这一次的累计概率，减去上一次的。
    say: S二进去就不出来，叫做吸收态，所以首达概率很好算：这一次的累计概率，减去上一次的。
  - sub: 代回去，第一项变成了：n 乘以每一级台阶的高度，再求和。
    say: 代回去，第一项变成了：n乘以每一级台阶的高度，再求和。
  - sub: 这个求和可以画成图来理解：每一级台阶，横着拉出一条长度为 n 的细条。
    say: 这个求和可以画成图来理解：每一级台阶，横着拉出一条长度是n的细条。
  - sub: 所有细条拼起来，正好是大矩形，减去台阶下方的面积。
  - sub: 写成式子，就是分部求和，也叫 Abel 变换。
    say: 写成式子，就是分部求和，也叫阿贝尔变换。
  - sub: 代回去，就得到了双目标的信仰变动期望公式。
  - sub: 数值代进去：10 个十连时 E 是 −0.41，11 个十连时是 +14.03。
    say: 数值代进去：十个十连时E是负零点四一，十一个十连时是正十四点零三。
  - sub: 所以常规双 UP 两个都要，临界十连数是 10 和 11。
    say: 所以常规双UP两个都要，临界十连数是十和十一。

S2_4_Delta:
  - sub: 看着这条曲线，聪明的同学可能会发现一个问题。
  - sub: 我们看相邻两个十连数之间，E 涨了多少，记作 ΔE。
    say: 我们看相邻两个十连数之间，E涨了多少，记作德尔塔E。
  - sub: 一次十连的成本，折算下来是 10 点信仰。ΔE 大于 10，说明多抽这一次是值得的。
    say: 一次十连的成本，折算下来是十点信仰。德尔塔E大于十，说明多抽这一次是值得的。
  - sub: 单目标的时候，ΔE 一路下降，正好在临界十连数附近跌破 10。
    say: 单目标的时候，德尔塔E一路下降，正好在临界十连数附近跌破十。
  - sub: 过了临界点，多抽就不如直接兑换，结论和 E 的正负一致。
    say: 过了临界点，多抽就不如直接兑换，结论和E的正负一致。
  - sub: 可双目标不一样：E 在 10 和 11 之间转正，ΔE 却一直到 13 和 14 之间，才跌破 10。
    say: 可双目标不一样：E在十和十一之间转正，德尔塔E却一直到十三和十四之间，才跌破十。
  - sub: 这就带来两个问题。第一，为什么会这样？
  - sub: 我们把 ΔE 拆开：一部分来自停在 S<sub>0</sub> 的情况，一部分来自停在 S<sub>1</sub> 的情况。
    say: 我们把德尔塔E拆开：一部分来自停在S零的情况，一部分来自停在S一的情况。
  - sub: S<sub>0</sub> 这部分衰减得很快，过了临界点就没剩多少了。
    say: S零这部分衰减得很快，过了临界点就没剩多少了。
  - sub: S<sub>1</sub> 却衰减得慢：只差一个目标，每次十连还有 12.5% 的机会补齐，省下 150 信仰。
    say: S一却衰减得慢：只差一个目标，每次十连还有百分之十二点五的机会补齐，省下一百五十信仰。
  - sub: S<sub>1</sub> 就像一个缓冲池，把 ΔE 大于 10 的区间，往后延长了大约 3 次十连。
    say: S一就像一个缓冲池，把德尔塔E大于十的区间，往后延长了大约三次十连。
  - sub: 第二个问题：实际抽卡时，临界值该取 10 和 11，还是 13 和 14？
    say: 第二个问题：实际抽卡时，临界值该取十和十一，还是十三和十四？
    quiz: true
  - sub: 答案是 10 和 11。我们最终想要的，是长期按这个策略抽，信仰基本不涨不跌。
    say: 答案是十和十一。我们最终想要的，是长期按这个策略抽，信仰基本不涨不跌。
  - sub: 单目标里两个标准恰好重合，多目标里它们分开了，要看的是 E 什么时候接近 0。
    say: 单目标里两个标准恰好重合，多目标里它们分开了，要看的是E什么时候接近零。

S2_5_Link2:
  - sub: 有了双 UP 这个模板，其他情况都可以直接套用。
    say: 有了双UP这个模板，其他情况都可以直接套用。
  - sub: 先看联动 4UP，只要其中特定的两个。
    say: 先看联动四UP，只要其中特定的两个。
  - sub: 状态图完全一样，价格也一样，只是每个角色的概率又减半，变成 0.7375%。
    say: 状态图完全一样，价格也一样，只是每个角色的概率又减半，变成百分之零点七三七五。
  - sub: 概率流得更慢：到第 30 次十连，还有大约四分之一的情况没拿齐。
    say: 概率流得更慢：到第三十次十连，还有大约四分之一的情况没拿齐。
  - sub: 临界十连数也往后推到了 13 和 14。
    say: 临界十连数也往后推到了十三和十四。

S2_6_Link4:
  - sub: 再看联动 4UP 全都要。要拿到 4 个角色，状态多了两个：S<sub>3</sub> 和 S<sub>4</sub>。
    say: 再看联动四UP全都要。要拿到四个角色，状态多了两个：S三和S四。
  - sub: 箭头一下子多了很多：从任何一个状态，都可能一次跳到后面任何一个状态。
  - sub: 这些转移概率怎么算？还是用 q<sub>k</sub>，只不过要用到容斥原理。
    say: 这些转移概率怎么算？还是用q k，只不过要用到容斥原理。
  - sub: 比如从 S<sub>0</sub> 一次拿到恰好两个：先选出是哪两个，有 6 种选法。
    say: 比如从S零一次拿到恰好两个：先选出是哪两个，有六种选法。
  - sub: 再算“另外两个都不出、这两个都出”的概率，就是 q<sub>2</sub> − 2q<sub>3</sub> + q<sub>4</sub>。
    say: 再算另外两个都不出、这两个都出的概率，就是q二减二q三加q四。
  - sub: 仔细看这些系数：1、4、6、4、1，正好来自杨辉三角。
    say: 仔细看这些系数：一、四、六、四、一，正好来自杨辉三角。
  - sub: 所有转移概率填进来，就是这个 5 × 5 的矩阵 R。
    say: 所有转移概率填进来，就是这个五乘五的矩阵R。
  - sub: 让概率流起来：五种颜色依次铺开，最后汇向 S<sub>4</sub>。
    say: 让概率流起来：五种颜色依次铺开，最后汇向S四。
  - sub: 但流得很慢：到第 30 次十连，也只有 56% 的情况 4 个全拿到。
    say: 但流得很慢：到第三十次十连，也只有百分之五十六的情况，四个全拿到。
  - sub: 信仰变动期望从 −600 开始，临界十连数是 18 和 19。
    say: 信仰变动期望从负六百开始，临界十连数是十八和十九。
  - sub: 这里插一个彩蛋，来自另一篇专栏。
  - sub: 同样是联动 4 个全都要，从 0 信仰开始：信仰够换剩下的角色就停手，不够就继续十连。
    say: 同样是联动四个全都要，从零信仰开始：信仰够换剩下的角色就停手，不够就继续十连。
  - sub: 最后会是什么结局？抽到 4 个、不用井的，只有 16.8%。
    say: 最后会是什么结局？抽到四个、不用井的，只有百分之十六点八。
  - sub: 抽到 3 个、井 1 个的，占了 74.2%，差不多每 4 个人里有 3 个。
    say: 抽到三个、井一个的，占了百分之七十四点二，差不多每四个人里有三个。
  - sub: 抽到 2 个、井 2 个的，是 9.0%；更惨的情况加起来，不到 0.05%。
    say: 抽到两个、井两个的，是百分之九；更惨的情况加起来，不到百分之零点零五。
  - sub: 所以联动全都要，大概率的结局是“抽三井一”。
    say: 所以联动全都要，大概率的结局是抽三井一。

S2_7_Link3:
  - sub: 只要其中特定的三个呢？比全都要还简单：把 S<sub>4</sub> 去掉就行。
    say: 只要其中特定的三个呢？比全都要还简单：把S四去掉就行。
  - sub: 系数变成 1、3、3、1，矩阵变成 4 × 4。
    say: 系数变成一、三、三、一，矩阵变成四乘四。
  - sub: 临界十连数是 16 和 17。
    say: 临界十连数是十六和十七。

S2_8_Mixed:
  - sub: 前面的目标都是等价的：概率一样，价格一样，所以只要看拿到了几个。
  - sub: 如果目标不等价呢？比如联动 4UP 里，只要一个特定角色，再加上头像框。
    say: 如果目标不等价呢？比如联动四UP里，只要一个特定角色，再加上头像框。
  - sub: 角色概率 0.7375%，价格 150；头像框概率 0.9%，价格 100。
    say: 角色概率百分之零点七三七五，价格一百五十；头像框概率百分之零点九，价格一百。
  - sub: 这时“拿到一个”要分成两种：只有头像框，记作 S<sub>a</sub>；只有角色，记作 S<sub>c</sub>。
    say: 这时拿到一个要分成两种：只有头像框，记作S a；只有角色，记作S c。
  - sub: 两种状态要兑换的东西不一样，价格也不一样，不能合并。
  - sub: 状态图从一条线，变成了一个菱形。
  - sub: 转移概率的思路不变：q<sub>c</sub> 是没出角色，q<sub>a</sub> 是没出头像框，q<sub>ca</sub> 是两个都没出。
    say: 转移概率的思路不变：q c是没出角色，q a是没出头像框，q c a是两个都没出。
  - sub: 比如 S<sub>0</sub> 到 S<sub>a</sub>：没出角色、但出了头像框，就是 q<sub>c</sub> − q<sub>ca</sub>。
    say: 比如S零到S a：没出角色、但出了头像框，就是q c减q c a。
  - sub: 代入计算，临界十连数是 12 和 13。
    say: 代入计算，临界十连数是十二和十三。

S2_9_Grad:
  - sub: 最后是最复杂的情况：毕业，也就是联动池的东西全都要。
  - sub: 4 个角色、1 个头像框、4 个装扮，一共 9 个目标。
    say: 四个角色、一个头像框、四个装扮，一共九个目标。
  - sub: 每个目标都有“有”和“没有”两种可能，直接组合的话，是 2<sup>9</sup>，也就是 512 个状态。
    say: 每个目标都有有和没有两种可能，直接组合的话，是二的九次方，也就是五百一十二个状态。
  - sub: 不过 4 个角色是等价的，只需要看拿到了几个，有 5 种；4 个装扮也是 5 种；头像框 2 种。
    say: 不过四个角色是等价的，只需要看拿到了几个，有五种；四个装扮也是五种；头像框两种。
  - sub: 合并之后是 5 × 2 × 5，一共 50 个状态。
    say: 合并之后是五乘二乘五，一共五十个状态。
