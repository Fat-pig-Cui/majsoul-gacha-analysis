# 上半部分旁白稿。每条 = 一个 TTS 片段 = 一条字幕。
# sub:   字幕显示文本（阿拉伯数字、符号；上下标写 <sub>n</sub>、<sup>9</sup>）
# say:   送给 TTS 的读法（省略时用去掉标记的 sub）
# quiz:  true 表示这句是给观众的思考题，句后自动留 5 秒倒计时再揭晓答案
# pause: 句后额外静音秒数（一般不用手写，quiz 会自动设置）
# 所有 say 在合成前都会经过 narration/pronounce.yaml 的读音替换（如 UP → Up、得先 → 嘚先）。
# 分镜 id 与 视频方案.md 第 4 节一致。

S1_0_Hook:
  - sub: 假如你手里有 12 个十连，信仰管够。
  - sub: 你同时想要一个联动角色，和一个贵人角色。
  - sub: 两个池子各抽几个十连，才最划算？
  - sub: 全砸联动？全砸贵人？还是对半分？
  - sub: 看完本视频，你就能自己算出答案。
  - sub: 我们从头说起。

S1_1_Probability:
  - sub: 先把规则捋一遍。雀魂的每一抽，结果分成三大类。
  - sub: 角色 5%，装扮 15%，剩下 80% 是礼物。
  - sub: 礼物我们不管，只看角色和装扮。
  - sub: 如果池子里有 UP 角色，UP 角色会分走角色概率里的 59%。
  - sub: 也就是 5% × 59%，等于 2.95%。
    say: 也就是百分之五乘以百分之五十九，等于百分之二点九五。
  - sub: UP 角色不止一位的话，就由这几位平分这 2.95%。
  - sub: 双 UP 每位 1.475%，联动 4UP 每位只有 0.7375%。
  - sub: 贵人比较特殊：只占角色概率的 20%，也就是固定 1%。
    say: 贵人比较特殊：只占角色概率的百分之二十，也就是固定百分之一。
  - sub: 装扮这边，UP 装扮占装扮概率的 49%，也就是 7.35%。
  - sub: 如果 UP 装扮里有头像框，头像框固定拿走其中的 6%，也就是 0.9%。
  - sub: 剩下的 43%，也就是 6.45%，由其他 UP 装扮平分。
  - sub: 所以记住两个数：UP 角色 2.95%，贵人 1%。

S1_2_Faith:
  - sub: 再说信仰。信仰是雀魂抽卡的最终保底，也就是常说的“井”。
  - sub: 抽一次得一点信仰，一比一对应，不同池子之间共享，还能继承。
  - sub: 兑换价格：常驻角色和联动角色 150，贵人 300。
  - sub: 装扮 50，头像框 100。
  - sub: 还有一个细节：辉玉十连必定出一个紫礼物。
  - sub: 所以对角色和装扮来说，一次十连只有 9 次有效抽卡。
  - sub: 价格也对得上：十连 1800 辉玉，正好是单抽 200 的 9 倍。
    say: 价格也对得上：十连一千八百辉玉，正好是单抽两百的九倍。
  - sub: 那十连图什么呢？多 1 点信仰，多 1 个紫礼物。
    say: 那十连图什么呢？多一点信仰，多一个紫礼物。
  - sub: 再加上单抽券很难攒，所以后面的分析，都按辉玉十连来算。

S1_3_Define:
  - sub: 有了这些规则，我们引入一个新概念：信仰变动期望。
  - sub: 假设信仰足够多，给定一个抽数，目标是一定要拿到某个角色或装扮。
  - sub: 结果只有两种。
  - sub: 第一种，在给定抽数内抽到了：目标到手，还白拿了这些抽数对应的信仰。
  - sub: 第二种，没抽到：只能花信仰兑换，信仰通常是净减少的。
  - sub: 这两种情况是对立事件，概率加起来正好是 1。
    say: 这两种情况是对立事件，概率加起来正好是一。
  - sub: 把给定抽数记作 G，抽到的概率记作 P，信仰价格记作 C。
  - sub: 抽到时，信仰变动是 G；没抽到时，是 G − C。
    say: 抽到时，信仰变动是G；没抽到时，是G减C。
  - sub: 按概率加权平均，就得到信仰变动期望 E。
  - sub: 它衡量的是：长期按这个策略抽卡，信仰是在涨还是在跌。
  - sub: 举个例子：常规单 UP 池，给定 0 抽，只能直接兑换，E 就是 −150。
    say: 举个例子：常规单UP池，给定零抽，只能直接兑换，E就是负一百五十。
  - sub: 给定 150 抽的话，没抽到时变动正好是 0，E 就等于 150 × P<sub>150</sub>。
    say: 给定一百五十抽的话，没抽到时变动正好是零，E就等于一百五十，乘以一百五十抽内抽到的概率。

S1_4_Refine:
  - sub: 刚才这个公式，其实藏着一个漏洞。
  - sub: 它默认了一件事：不管抽没抽到，都会把给定的抽数抽满。
  - sub: 可现实里，谁会这么抽呢？
  - sub: 比如给了 150 抽，第 40 抽就出货了，你肯定当场收手。
    say: 比如给了一百五十抽，第四十抽就出货了，你肯定当场收手。
  - sub: 剩下的 110 抽，根本不会花出去。
    say: 剩下的一百一十抽，根本不会花出去。
  - sub: 所以“抽到”这一支，要按“第几抽抽到”再拆开。
  - sub: 第 1 抽抽到、第 2 抽抽到……一直到第 M 抽抽到，每种情况的概率都能算。
    say: 第一抽抽到、第二抽抽到，一直到第M抽抽到，每种情况的概率都能算。
  - sub: 把第 n 抽首次命中的概率记作 u<sub>n</sub>，第 M 抽就是 u<sub>M</sub>，
    say: 把第n抽首次命中的概率，记作u n，第M抽就是u M，
  - sub: 把抽满 M 抽仍没命中的概率记作 v<sub>M</sub>。
    say: 把抽满M抽仍然没命中的概率，记作v M。
  - sub: 第 n 抽抽到，信仰变动就是 n；一直没抽到，就是 M 减去兑换价格 C。
    say: 第n抽抽到，信仰变动就是n；一直没抽到，就是M减去兑换价格C。
  - sub: 两部分加起来，就是优化后的公式。
  - sub: 不过还差最后一步。
  - sub: 前面说过，辉玉十连只有 9 次有效抽卡，却给 10 点信仰。
    say: 前面说过，辉玉十连只有九次有效抽卡，却给十点信仰。
  - sub: 而且对大多数玩家来说，真正能拿来做规划的，只有辉玉十连。
  - sub: 所以把“抽”换成“十连”：第 n 次十连首次命中，信仰变动就是 10n。
    say: 所以把抽换成十连：第n次十连首次命中，信仰变动就是十n。
  - sub: 这就是后面一直要用的最终公式。

S1_5_Example:
  - sub: 趁热打铁，我们来算一道题。
  - sub: 目标是常规单 UP 池的 UP 角色，信仰价格 150，单抽概率 2.95%。
    say: 目标是常规单UP池的UP角色，信仰价格一百五十，单抽概率百分之二点九五。
  - sub: 现在只给 5 次十连，信仰变动期望是多少？
    say: 现在只给五次十连，信仰变动期望是多少？
  - sub: 第一步，先把单抽概率换成一次十连的概率。
  - sub: 一次十连有 9 次有效抽卡，9 次全不中的概率是 (1−p)<sup>9</sup>。
    say: 一次十连有九次有效抽卡，九次全不中的概率，是一减p的九次方。
  - sub: 所以一次十连至少出一个的概率，大约是 0.236。
    say: 所以一次十连至少出一个的概率，大约是零点二三六。
  - sub: 差不多每 4 次十连，就有 1 次能出货。
    say: 差不多每四次十连，就有一次能出货。
  - sub: 先算简单的部分：5 次十连全都没中。
    say: 先算简单的部分：五次十连全都没中。
  - sub: 概率是 0.764 的 5 次方，大约 0.26。
    say: 概率是零点七六四的五次方，大约零点二六。
  - sub: 这时手里多了 50 信仰，却要花 150 去兑换，净亏 100。
    say: 这时手里多了五十信仰，却要花一百五十去兑换，净亏一百。
  - sub: 这部分的贡献是 −100 × 0.26，约等于 −26。
    say: 这部分的贡献，是负一百乘零点二六，约等于负二十六。
  - sub: 再算抽到的部分。第 1 次十连就出，概率 0.236，信仰 +10。
    say: 再算抽到的部分。第一次十连就出，概率零点二三六，信仰加十。
  - sub: 第 2 次十连才出，得先歪一次，概率再乘 0.764，信仰 +20。
    say: 第二次十连才出，得先歪一次，概率再乘零点七六四，信仰加二十。
  - sub: 以此类推，一直到第 5 次十连。
    say: 以此类推，一直到第五次十连。
  - sub: 5 项加起来，大约 18.33。
    say: 五项加起来，大约十八点三三。
  - sub: 两部分相加：18.33 − 26 = −7.67。
    say: 两部分相加：十八点三三减二十六，等于负七点六七。
  - sub: 意思是：只给 5 个十连，抽到就停，抽不到就换，
    say: 意思是：只给五个十连，抽到就停，抽不到就换，
  - sub: 长期来看每次大约亏 7.67 信仰。亏得不多，再加一个十连，说不定就转正了。
    say: 长期来看每次大约亏七点六七信仰。亏得不多，再加一个十连，说不定就转正了。
  - sub: 留一道思考题：如果不考虑“抽到就停手”，结果会偏高还是偏低？
    quiz: true     # 句后留 5 秒倒计时再揭晓
  - sub: 答案是偏高。按“抽满不停”算，结果是 +11.02，连正负号都反了。
    say: 答案是偏高。按抽满不停来算，结果是正十一点零二，连正负号都反了。
  - sub: 因为它把出货之后、其实不会再抽的那些十连，也算进了信仰收益。

S1_6_Critical:
  - sub: 有了公式，就可以把每个十连数对应的期望都算出来。
  - sub: 还是常规单 UP 池，十连数从 0 一直算到 15。
  - sub: 0 个十连是 −150，然后一路往上爬。
    say: 零个十连是负一百五十，然后一路往上爬。
  - sub: 到 5 个十连，还是 −7.66。到 6 个十连，变成了 +4.15。
    say: 到五个十连，还是负七点六六。到六个十连，变成了正四点一五。
  - sub: 之前手算的 −7.67 差了 0.01，是提前四舍五入造成的，不影响结论。
    say: 之前手算的负七点六七差了零点零一，是提前四舍五入造成的，不影响结论。
  - sub: 期望由负转正附近的这两个十连数，我们叫它“临界十连数”。
  - sub: 抽 5 个十连，信仰长期缓慢下降，每次亏 7.66，亏得不多，能接受。
    say: 抽五个十连，信仰长期缓慢下降，每次亏七点六六，亏得不多，能接受。
  - sub: 抽 6 个十连，信仰长期缓慢上升，每次赚 4.15，但攒久了信仰会花不完。
    say: 抽六个十连，信仰长期缓慢上升，每次赚四点一五，但攒久了信仰会花不完。
  - sub: 一个略亏，一个略赚，正好互补。
  - sub: 再往后，曲线越来越平：多抽一次十连，换来的期望越来越少。

S1_7_Pools:
  - sub: 换个池子，概率和价格一变，曲线就跟着变。
  - sub: 常规双 UP，单个角色的概率减半，曲线整体往右移，临界十连数变成 7 和 8。
    say: 常规双UP，单个角色的概率减半，曲线整体往右移，临界十连数变成七和八。
  - sub: 贵人，概率只有 1%，价格还翻倍到 300，临界十连数一下子跳到 14 和 15。
    say: 贵人，概率只有百分之一，价格还翻倍到三百，临界十连数一下子跳到十四和十五。
  - sub: 联动 4UP 单个角色，概率只剩 0.7375%，临界十连数是 10 和 11。
    say: 联动四Up单个角色，概率只剩百分之零点七三七五，临界十连数是十和十一。
  - sub: 装扮这边，头像框概率 0.9%、价格 100，临界十连数是 7 和 8。
    say: 装扮这边，头像框概率百分之零点九、价格一百，临界十连数是七和八。
  - sub: 普通装扮只要 50 信仰，就算是 5 个 UP 平分，临界十连数也只有 3 和 4。
    say: 普通装扮只要五十信仰，就算是五个Up平分，临界十连数也只有三和四。
  - sub: 有头像框、总共 3 个 UP 装扮时，其余两个装扮概率最高，临界十连数降到 2 和 3。
    say: 有头像框、总共三个Up装扮时，其余两个装扮概率最高，临界十连数降到二和三。
  - sub: 把它们放在一起看：角色的临界十连数都不小，攒单抽券根本攒不到这个量。
  - sub: 说到底，抽卡规划还是氪金玩家的专利。

S1_8_Answer:
  - sub: 现在回到开头的问题：12 个十连，一个联动角色，一个贵人。
    say: 现在回到开头的问题：十二个十连，一个联动角色，一个贵人。
  - sub: 如果只有一个池子，12 个十连的期望是固定的，没什么好选。
    say: 如果只有一个池子，十二个十连的期望是固定的，没什么好选。
  - sub: 两个池子就不一样了：联动抽 k 个，贵人就抽 12 − k 个。
    say: 两个池子就不一样了：联动抽k个，贵人就抽十二减k个。
  - sub: 每种分法，分别查两个池子的期望，加起来就是总期望。
  - sub: 先猜一猜：哪种分法的总期望最大？
    quiz: true
  - sub: 我们从“联动 0 个、贵人 12 个”开始，一个个试过去。
    say: 我们从联动零个、贵人十二个开始，一个个试过去。
  - sub: 答案是：联动 3 个十连，贵人 9 个十连，总期望 −163.23，是所有分法里最大的。
    say: 答案是：联动三个十连，贵人九个十连，总期望负一百六十三点二三，是所有分法里最大的。
  - sub: 全砸联动最差，是 −282.03，比最优解多亏了将近 120 信仰。
    say: 全砸联动最差，是负二百八十二点零三，比最优解多亏了将近一百二十信仰。
  - sub: 注意，最优解的总期望仍然是负的：两个都要，信仰注定要往外掏。
  - sub: 我们能做的，只是让它少掏一点。

S1_9_Summary:
  - sub: 本视频的内容，总结成三句话。
  - sub: 第一，信仰变动期望，衡量一个抽卡策略长期是赚信仰还是亏信仰。
  - sub: 第二，期望由负转正的“临界十连数”，就是一个池子最合理的抽卡量。
  - sub: 第三，概率越低、价格越高，临界十连数就越大。
  - sub: 不过，到这里我们只讨论了“只要一个目标”的情况。
  - sub: 如果双 UP 两个都想要，或者联动 4 个全都要呢？
    say: 如果双UP两个都想要，或者联动四个全都要呢？
  - sub: 状态一多，就得请出马尔科夫链了。我们下个视频见。
